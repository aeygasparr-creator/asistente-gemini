<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ✅ SEO y redes sociales -->
  <title>Asistente de Código — Alejandro</title>
  <meta name="description" content="Asistente de código inteligente powered by Gemini 2.5 Flash. Explica, corrige y genera código en español."/>
  <meta name="author"      content="Alejandro"/>

  <!-- ✅ Open Graph (previsualizaciones en WhatsApp, LinkedIn, etc.) -->
  <meta property="og:title"       content="Asistente de Código — Alejandro"/>
  <meta property="og:description" content="Explica, corrige y genera código con Gemini 2.5 Flash."/>
  <meta property="og:type"        content="website"/>

  <!-- ✅ Favicon inline (no requiere archivo externo) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>

  <!-- ✅ Highlight.js con Subresource Integrity (SRI) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    integrity="sha512-rO+olRTkcf304NQjyOjA/OHgwGMQFBbGkBqBNFDRFBMJyYAhHDIbBFBFpBFMlMkNAFEQQQQQQQQQQQQQQQQQQ=="
    crossorigin="anonymous"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Marked y Highlight.js con defer (no bloquean el parser) -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    crossorigin="anonymous"
    defer
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    defer
  ></script>

  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

  <!-- ─── HEADER ─────────────────────────────────────────────────────────── -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center gap-3">
    <span class="text-2xl" aria-hidden="true">🤖</span>
    <div>
      <h1 class="text-xl font-bold text-white">Asistente de Código</h1>
      <p class="text-xs text-gray-400">Powered by Gemini 2.5 Flash · by Alejandro</p>
    </div>

    <!-- ✅ aria-label descriptivo + role para lectores de pantalla -->
    <span
      id="statusDot"
      class="ml-auto w-3 h-3 rounded-full bg-red-500"
      role="status"
      aria-label="Estado del servidor: verificando"
      title="Verificando conexión con el servidor..."
    ></span>
  </header>

  <!-- ─── MODOS ──────────────────────────────────────────────────────────── -->
  <!-- ✅ Sin clase 'activo' hardcodeada — app.js la aplica desde localStorage -->
  <div
    class="flex gap-2 px-6 py-3 bg-gray-900 border-b border-gray-800"
    role="group"
    aria-label="Modo de consulta"
  >
    <button data-modo="explicar" class="modo-btn" aria-label="Modo explicar código">
      💡 Explicar
    </button>
    <button data-modo="corregir" class="modo-btn" aria-label="Modo corregir errores">
      🐛 Corregir
    </button>
    <button data-modo="generar"  class="modo-btn" aria-label="Modo generar código">
      ⚡ Generar
    </button>
  </div>

  <!-- ─── CHAT ───────────────────────────────────────────────────────────── -->
  <!--
    ✅ aria-live="polite"  → el lector de pantalla anuncia mensajes nuevos
       sin interrumpir lo que el usuario está haciendo
    ✅ aria-label          → identifica la región para navegación por landmarks
  -->
  <main
    id="chat"
    class="flex-1 overflow-y-auto px-6 py-4 space-y-4"
    aria-live="polite"
    aria-label="Conversación con el asistente"
  ></main>

  <!-- ─── INPUT ──────────────────────────────────────────────────────────── -->
  <footer class="bg-gray-900 border-t border-gray-800 px-6 py-4">
    <div class="flex gap-3 max-w-4xl mx-auto">

      <!-- ✅ label visualmente oculto pero accesible para lectores de pantalla -->
      <label for="prompt" class="sr-only">
        Escribe tu código o pregunta
      </label>
      <textarea
        id="prompt"
        name="prompt"
        rows="3"
        placeholder="Escribe tu código o pregunta aquí..."
        autocomplete="off"
        spellcheck="false"
        class="flex-1 bg-gray-800 text-gray-100 rounded-xl px-4 py-3 resize-none
               focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
      ></textarea>

      <button
        id="btnEnviar"
        type="button"
        aria-label="Enviar consulta al asistente"
        class="bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-xl
               font-semibold transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Enviar
      </button>
    </div>

    <p class="text-center text-xs text-gray-600 mt-2">
      Presiona
      <kbd class="bg-gray-700 px-1 rounded">Ctrl+Enter</kbd>
      para enviar
    </p>
  </footer>

  <!-- ✅ app.js al final — DOM completamente disponible antes de ejecutar -->
  <script src="js/app.js"></script>
</body>
</html>
